            </g>
            <text x="38" y="24" fill="#94a3b8" font-size="12" font-weight="500">Reports</text>
        </g>
        
        <g transform="translate(12, 328)">
            <rect x="0" y="0" width="232" height="38" rx="8" fill="transparent" />
            <g transform="translate(14, 12)" stroke="#94a3b8" fill="#94a3b8">
